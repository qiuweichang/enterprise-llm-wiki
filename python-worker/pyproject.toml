[project]
name = "llm-wiki-python-worker"
version = "1.0.0"
description = "Independent web extraction, OCR and transcription service for LLM Wiki"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13.4",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "markdownify>=1.1.0",
  "pydantic-settings>=2.10.0",
  "python-docx>=1.2.0",
  "pypdf>=5.8.0",
  "uvicorn[standard]>=0.35.0"
]

[project.optional-dependencies]
ocr = ["pillow>=11.3.0", "pytesseract>=0.3.13", "pdf2image>=1.17.0"]
transcription = ["faster-whisper>=1.1.1"]
test = ["pytest>=8.4.0", "pytest-asyncio>=1.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

